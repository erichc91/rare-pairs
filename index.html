<style>
:root {

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080c18; --stage: #0c1222; --card: #0a1020; --ink: #e5e9f3; --mute: #7a849b; --grid: rgba(170, 185, 225, 0.09);

}
:root[data-theme="dark"] {

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
body {

  padding-block: 28px 48px;
}
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 28px; }
.hero { text-align: center; display: grid; gap: 8px; justify-items: center; }
.hero h1 { font-family: var(--font-cap); font-weight: 400; font-size: clamp(2rem, 5vw, 3.1rem); margin: 0; letter-spacing: 0.005em; }
.hero p { margin: 0; max-width: 62ch; color: var(--mute); }
.hero .cap { font-family: var(--font-cap); font-style: italic; font-size: 1.15rem; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; color: var(--mute); font-size: 12px; }
.legend b { color: var(--ink); font-weight: 500; }
.card {
  background: var(--card); border-radius: 18px; overflow: hidden;
  box-shadow: 0 1px 0 var(--grid), 0 20px 60px -34px rgba(0, 0, 0, 0.38);
  display: grid;
}
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 14px 18px 10px; }
.num { font-family: var(--font-cap); font-size: 1.6rem; color: var(--mute); width: 1.6em; }
.law { display: grid; gap: 1px; min-width: 0; flex: 1 1 260px; }
.law b { font-weight: 500; font-size: 1rem; }
.law span { color: var(--mute); font-size: 12px; }
.chip { font-size: 11px; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--grid); }
.chip.UNSEEN { color: var(--b2); border-color: color-mix(in srgb, var(--b2) 50%, transparent); }
.chip.RARE { color: var(--b1); border-color: color-mix(in srgb, var(--b1) 50%, transparent); }
.uniq { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--mute); }
.uniq .bar { width: 96px; height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.uniq .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--a2), var(--b2)); }
.stage { position: relative; background: var(--stage); }
.stage canvas { display: block; width: 100%; }
.names { display: grid; grid-template-columns: 1fr 1.25fr 1fr; gap: 14px; padding: 12px 18px 4px; align-items: start; }
.nm b { display: block; font-family: var(--font-cap); font-weight: 400; font-size: 1.12rem; line-height: 1.25; }
.nm span { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }
.nm.a span { color: var(--a2); } .nm.b span { color: var(--b2); }
.nm.b { text-align: right; }
.mid { text-align: center; color: var(--mute); font-family: var(--font-cap); font-style: italic; font-size: 1.02rem; }
.sure { margin: 6px 18px 0; font-size: 12px; color: var(--mute); }
.sure b { color: var(--ink); font-weight: 500; }
details { margin: 6px 18px 16px; font-size: 12px; color: var(--mute); }
summary { cursor: pointer; color: var(--ink); width: fit-content; }
.src { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
.src > div { border-left: 2px solid var(--grid); padding-left: 10px; min-width: 0; }
.src a { color: var(--ink); }
.src .tex { overflow-x: auto; padding: 4px 0; color: var(--ink); }
.src code { font-family: var(--font-num); font-size: 11px; word-break: break-all; }
.ev { margin-top: 8px; }
.ev a { color: var(--ink); word-break: break-all; }
.foot { color: var(--mute); font-size: 12px; max-width: 80ch; margin: 0 auto; display: grid; gap: 6px; }
.foot b { color: var(--ink); font-weight: 500; }
@media (max-width: 680px) {
  .names { grid-template-columns: 1fr 1fr; }
  .mid { grid-column: 1 / -1; order: 3; }
  .src { grid-template-columns: 1fr; }
  .head { padding: 12px 14px 8px; }
}
</style>
</head>

<div class="wrap">
  <header class="hero">
    <p class="cap">same law, two worlds</p>
    <h1>Rare pairs</h1>
    <p>Each card shows two things from fields that almost never talk to each other. A computer proof checks that both obey the very same equation. In each picture the two worlds run on the <b>same random draws</b>, so they cannot disagree, and they trace one shared curve.</p>
    <div class="legend" id="legend"></div>
  </header>
  <main id="cards" style="display:grid;gap:26px"></main>
  <section class="foot" id="foot"></section>
</div>

          : [cx + (q[3] - 0.5) * w * 0.8, bot + (q[4] - 0.5) * h * 0.34 + Math.sin(clock * 0.7 + q[0] * 7) * 0.8];
        if (t < p.T) mark(ctx, home0[0], home0[1], r, before, 0.85);
        else if (t < p.T + TR) { const k = ease((t - p.T) / TR); const x = lerp(home0[0], home1[0], k), y = lerp(home0[1], home1[1], k) - Math.sin(k * Math.PI) * h * 0.06; mark(ctx, x, y, r * 1.5, law.up ? after : c1, 0.95); halo(ctx, x, y, r * 5, law.up ? after : c1, 0.3); }
        else mark(ctx, home1[0], home1[1], r, after, law.up ? 0.9 : 1.6);
      }
    } else if (law.kind === "disp") {
      const amp = w * 0.3, wallX = side ? Wd.x1 - 8 : Wd.x0 + 8;
      const x0 = cx + amp * law.raw(t);
      // spring from wall to the cloud's centre
      ctx.strokeStyle = alpha(c0, 0.6); ctx.lineWidth = 1.2; ctx.beginPath();
      const n = 14; for (let k = 0; k <= n; k++) { const xx = lerp(wallX, x0, k / n), yy = cy + (k % 2 ? 1 : -1) * (k === 0 || k === n ? 0 : h * 0.04); k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke();
      halo(ctx, x0, cy, w * 0.3, c1, 0.25);
      for (const p of sim.P) {
        const q = p.r, rr = Math.sqrt(q[0]) * Math.min(w, h) * 0.24, a = q[1] * 6.283;
        const xx = cx + amp * law.raw(Math.max(0, t - p.lag)) + Math.cos(a) * rr, yy = cy + Math.sin(a) * rr * 1.1;
        mark(ctx, xx, yy, r, Math.abs(xx - cx) > amp * 0.5 ? c1 : c0, 0.85);
      }
    } else if (law.kind === "wave") {
      const n = 64;
      for (let k = 0; k < n; k++) {
        const s = k / (n - 1), u = law.u(s, t);
        for (let j = 0; j < 2; j++) {
          const p = sim.P[(k * 2 + j) % N].r;
          const xx = Wd.x0 + 10 + s * (w - 20), yy = cy - u * h * 0.32 + (j - 0.5) * 7 + (p[0] - 0.5) * 3;
          mark(ctx, xx, yy, r, Math.abs(u) > 0.15 ? c1 : c0, 0.9);
        }
      }
      const px = Wd.x0 + 10 + 0.8 * (w - 20);
      ctx.strokeStyle = alpha(C.mute, 0.6); ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(px, Wd.y0 + 10); ctx.lineTo(px, Wd.y1 - 10); ctx.stroke(); ctx.setLineDash([]);
    } else {
      // walkers: identical paths in both worlds
      const sc = Math.min(w, h) * 0.3 / sim.rmsEnd, k = clamp01(t / T_END) * sim.P[0].steps, i0 = Math.floor(k), f = k - i0;
      halo(ctx, cx, cy, sc * 1.5 * Math.max(0.15, law.y(t)), c1, 0.22);
      dot(ctx, cx, cy, 3, c0, 0.9);
      for (const p of sim.P) {
        const i1 = Math.min(p.steps, i0 + 1), x = lerp(p.path[i0 * 2], p.path[i1 * 2], f), y = lerp(p.path[i0 * 2 + 1], p.path[i1 * 2 + 1], f);
        const xx = cx + x * sc, yy = cy + y * sc;
        if (xx < Wd.x0 + 2 || xx > Wd.x1 - 2 || yy < Wd.y0 + 2 || yy > Wd.y1 - 2) continue;
        mark(ctx, xx, yy, r, Math.hypot(x, y) > 0.5 * sim.rmsEnd ? c1 : c0, 0.85);
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
  }

  function drawChart(v) {
    const { ctx, L, sim, t } = v, { x0, x1, y0, y1 } = L.ch, law = sim.law;
    const X = tt => x0 + (tt / T_END) * (x1 - x0), Y = val => y1 - val * (y1 - y0);
    ctx.font = `${L.phone ? 9 : 10}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textBaseline = "middle"; ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.fillStyle = C.mute;
    for (const val of [0, 0.5, 1]) { ctx.beginPath(); ctx.moveTo(x0, Y(val)); ctx.lineTo(x1, Y(val)); ctx.stroke(); }
    ctx.textAlign = "center"; ctx.fillText("time", (x0 + x1) / 2, y1 + 14);
    const yl = { member: law.up ? "fraction switched" : "fraction left", disp: "position", wave: "height at probe", walk: "spread" }[law.kind];
    ctx.save(); ctx.translate(x0 - 14, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(yl, 0, 0); ctx.restore();
    if (law.ghost) {
      const gp = new Path2D(); gp.moveTo(X(0), Y(law.ghost(0)));
      for (let tt = 0.02; tt <= Math.min(t, T_END); tt += 0.02) gp.lineTo(X(tt), Y(law.ghost(tt)));
      ctx.strokeStyle = alpha(C.mute, 0.7); ctx.setLineDash([2, 4]); ctx.lineWidth = 1.4; ctx.stroke(gp); ctx.setLineDash([]);
      ctx.fillStyle = C.mute; ctx.textAlign = "left"; ctx.fillText("tipping point", x0 + 4, Y(law.thresh) - 8);
      ctx.strokeStyle = alpha(C.mute, 0.4); ctx.beginPath(); ctx.moveTo(x0, Y(law.thresh)); ctx.lineTo(x1, Y(law.thresh)); ctx.stroke();
    }
    const tEnd = Math.min(t, T_END), step = T_END / 500, path = new Path2D();
    path.moveTo(X(0), Y(law.y(0)));
    for (let tt = step; tt <= tEnd; tt += step) path.lineTo(X(tt), Y(law.y(tt)));
    path.lineTo(X(tEnd), Y(law.y(tEnd)));
    const area = new Path2D(path); area.lineTo(X(tEnd), Y(0)); area.lineTo(X(0), Y(0)); area.closePath();
    const grad = ctx.createLinearGradient(0, y0, 0, y1); grad.addColorStop(0, alpha(C.a2, 0.14)); grad.addColorStop(0.5, alpha(C.b2, 0.08)); grad.addColorStop(1, alpha(C.b2, 0));
    ctx.fillStyle = grad; ctx.fill(area);
    ctx.lineJoin = "round"; ctx.lineWidth = L.phone ? 2.4 : 3;
    ctx.setLineDash([8, 8]); ctx.lineDashOffset = 0; ctx.strokeStyle = C.a2; ctx.stroke(path);
    ctx.lineDashOffset = 8; ctx.strokeStyle = C.b2; ctx.stroke(path); ctx.setLineDash([]); ctx.lineDashOffset = 0;
    // live point + tethers to both gauges at the same height: the two worlds agree
    const val = law.y(tEnd), ly = Y(val), lx = X(tEnd);
    ctx.lineWidth = 1.1; ctx.setLineDash([2, 5]);
    ctx.strokeStyle = alpha(C.a2, 0.7); ctx.beginPath(); ctx.moveTo(L.gA, ly); ctx.lineTo(lx, ly); ctx.stroke();
    ctx.strokeStyle = alpha(C.b2, 0.7); ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(L.gB, ly); ctx.stroke(); ctx.setLineDash([]);
    if (C.glow) ctx.globalCompositeOperation = "lighter";
    halo(ctx, lx, ly, 18, C.a2, 0.35); halo(ctx, lx, ly, 11, C.b2, 0.35);
    ctx.globalCompositeOperation = "source-over";
    dot(ctx, lx, ly, 4.5, C.ink, 1);
    for (const [gx, col] of [[L.gA, C.a2], [L.gB, C.b2]]) {
      ctx.lineCap = "round"; ctx.strokeStyle = C.grid; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(gx, y0); ctx.lineTo(gx, y1); ctx.stroke();
      ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(gx, y1); ctx.lineTo(gx, ly); ctx.stroke(); dot(ctx, gx, ly, 4, col, 1);
    }
  }

  function draw(v, clock = 0) {
    const { ctx } = v;
    ctx.setTransform(v.dpr, 0, 0, v.dpr, 0, 0); ctx.clearRect(0, 0, v.W, v.H);
    drawWorld(v, 0, clock); drawWorld(v, 1, clock); drawChart(v);
  }

  // ---------- loop: only visible cards animate ----------
  const io = new IntersectionObserver(es => es.forEach(e => { const v = views.find(x => x.cv === e.target); if (v) v.vis = e.isIntersecting; }), { rootMargin: "80px" });
  views.forEach(v => io.observe(v.cv));
  if (reduced) { views.forEach(v => draw(v)); return; }
  let last = null, clock = 0;
  function frame(ts) {
    const dt = last == null ? 0 : Math.min(0.05, (ts - last) / 1000); last = ts; clock += dt;
    for (const v of views) {
      if (!v.vis) continue;
      if (v.t < T_END) v.t = Math.min(T_END, v.t + dt * T_END / PLAY);
      else { v.hold += dt; if (v.hold > HOLD) { v.t = 0; v.hold = 0; } }
      draw(v, clock + v.phase);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // numeric self-check hook: both worlds read the same draws, so per-card switched fraction == curve (member laws)
  window.__rp = { check() { return views.map(v => { const law = v.sim.law; if (law.kind !== "member") return { law: v.c.fam, kind: law.kind }; const tt = 5; const frac = v.sim.P.filter(p => tt >= p.T).length / N; return { law: v.c.fam, t: tt, curve: law.up ? law.y(tt) : 1 - law.y(tt), switched: frac }; }); }, set(tt) { views.forEach(v => { v.t = tt; v.hold = -1e9; draw(v); }); } };
})();
</script>
